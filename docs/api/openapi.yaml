openapi: 3.1.0
info:
  title: Mineplay Punishments Server API
  version: 1.1.0
  description: |
    Contract to implement in the existing ASP.NET Core website. This repository implements
    the Paper client, not these endpoints. Every response echoes the request UUID and the
    authenticated server ID. HTTPS is mandatory; redirects are rejected. Server credentials
    must not authenticate ordinary website users. All timestamps are UTC ending in Z.
servers:
  - url: https://www.mineplay.co.uk/api/moderation/server
security:
  - serverCredential: []
paths:
  /players:
    post:
      operationId: observeServerPlayers
      summary: Publish the historical roster and current player observations
      description: |
        Atomic batch of 1-100 distinct player UUIDs, under 1 MiB UTF-8 including envelope.
        Body IDs match headers. Shares the moderation 240 requests/minute/IP limit.
        Identity is (serverId,playerUuid,revision). Identical canonical JSON at the same
        revision is idempotent; older revisions are ignored. Array order, representation,
        and null versus omission affect identity. Never alter a frozen retry snapshot.
        Newer revisions cannot regress observedAt/latest join/logout, advance first join,
        or clear known logout. Sessions merge by stable ID; closed sessions cannot change
        or reopen. Invalid/conflicting items reject the entire batch. See player-telemetry.md.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ServerHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  required: [players]
                  properties:
                    players:
                      type: array
                      minItems: 1
                      maxItems: 100
                      items: { $ref: '#/components/schemas/PlayerTelemetry' }
              unevaluatedProperties: false
      responses:
        '200':
          description: Whole transaction committed; accepted and ignored UUIDs partition the submitted players
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [acceptedPlayerIds, ignoredPlayerIds]
                    properties:
                      acceptedPlayerIds:
                        type: array
                        uniqueItems: true
                        items: { $ref: '#/components/schemas/PlayerUuid' }
                      ignoredPlayerIds:
                        type: array
                        uniqueItems: true
                        items: { $ref: '#/components/schemas/PlayerUuid' }
                unevaluatedProperties: false
        '400': { description: Invalid envelope or player item; entire batch rejected }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: PLAYER_REVISION_CONFLICT, PLAYER_OBSERVATION_CONFLICT, PLAYER_TIMELINE_CONFLICT or PLAYER_SESSION_CONFLICT; entire batch rejected
        '429': { $ref: '#/components/responses/Retry' }
        '503': { $ref: '#/components/responses/Retry' }
  /reconciliation:
    get:
      operationId: reconcileServer
      summary: Replay every retained command after the cursor, including offline revocations
      description: |
        Called on every plugin startup. Establish a stable snapshot high-water mark on the
        first page and return all command outcomes through it in order. Do not return an
        authoritative active-list replacement. A cursor must never skip an unreturned command.
        Keep a cursor and its associated snapshot valid across reconnects and response loss.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ServerHeader'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ordered delta page; empty page still carries a nonempty cursor
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ActionPage'
                  - type: object
                    required: [snapshotRevision]
                    properties:
                      snapshotRevision: { type: string, minLength: 1, maxLength: 128 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ReconciliationRequired' }
        '429': { $ref: '#/components/responses/Retry' }
        '503': { $ref: '#/components/responses/Retry' }
  /actions:
    get:
      operationId: pollServerActions
      summary: Poll the durable per-server command stream
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ServerHeader'
        - $ref: '#/components/parameters/ServerId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Ordered page. Cursor is durably committed with all local action outcomes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ReconciliationRequired' }
        '429': { $ref: '#/components/responses/Retry' }
        '503': { $ref: '#/components/responses/Retry' }
  /actions/acknowledgements:
    post:
      operationId: acknowledgeActions
      summary: Persist idempotent plugin commit or rejection outcomes
      description: |
        applied=true means SQLite committed and the enforcement cache was refreshed. Kick
        delivery and community-service inventory restoration are separately reported events.
        Never call a community-service release restored solely from this acknowledgement.
        Deduplicate by (serverId, actionId). Repeated equal outcomes must return success.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ServerHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  required: [acknowledgements]
                  properties:
                    acknowledgements:
                      type: array
                      minItems: 1
                      maxItems: 1000
                      items: { $ref: '#/components/schemas/ActionOutcome' }
      responses:
        '200':
          description: Only identifiers durably accepted in PostgreSQL; partial acceptance is allowed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [acceptedActionIds]
                    properties:
                      acceptedActionIds:
                        type: array
                        uniqueItems: true
                        items: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/Retry' }
        '503': { $ref: '#/components/responses/Retry' }
  /events:
    post:
      operationId: receivePluginEvents
      summary: Receive a batch from the SQLite outbox
      description: |
        Deduplicate durably by (serverId,eventId). Commit before returning acceptedEventIds.
        Verify punishment revisions; retain out-of-order events for reconciliation, never
        silently overwrite a newer decision. Actor names and reasons are untrusted text.
        Payloads never contain inventory snapshots, appeal tokens, or credential material.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ServerHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  required: [events]
                  properties:
                    events:
                      type: array
                      minItems: 1
                      maxItems: 1000
                      items: { $ref: '#/components/schemas/Event' }
      responses:
        '200':
          description: Includes duplicate event IDs already committed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [acceptedEventIds]
                    properties:
                      acceptedEventIds:
                        type: array
                        uniqueItems: true
                        items: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/Retry' }
        '503': { $ref: '#/components/responses/Retry' }
  /appeals/provision:
    post:
      operationId: provisionAppealLink
      summary: Register or retrieve one stable backend-generated secret link
      description: |
        Generate at least 32 random bytes with a cryptographic RNG, base64url without padding.
        Commit the token binding in PostgreSQL before responding. A repeat of the same
        (serverId,provisioningId) MUST return the identical URL, even after response loss.
        A fresh provisioningId for an existing punishment requests explicit rotation.
        Verify punishmentId/targetPlayerId bindings against received event context. A 409
        may be used when the corresponding creation event has not arrived yet.
        Token-bearing responses require Cache-Control:no-store and must never be logged.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ServerHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  required: [provisioningId, punishmentId, targetPlayerId]
                  properties:
                    provisioningId: { type: string, format: uuid }
                    punishmentId: { type: string, format: uuid }
                    targetPlayerId: { type: string, format: uuid }
      responses:
        '200':
          description: A usable, backend-registered dedicated appeal URL
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [provisioningId, punishmentId, appealUrl]
                    properties:
                      provisioningId: { type: string, format: uuid }
                      punishmentId: { type: string, format: uuid }
                      appealUrl: { $ref: '#/components/schemas/AppealUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ReconciliationRequired' }
        '429': { $ref: '#/components/responses/Retry' }
        '503': { $ref: '#/components/responses/Retry' }
components:
  securitySchemes:
    serverCredential:
      type: http
      scheme: bearer
      description: Separate revocable credential per server; identify the permitted server from its verified credential
  parameters:
    RequestId:
      in: header
      name: X-Request-Id
      required: true
      schema: { type: string, format: uuid }
    ServerHeader:
      in: header
      name: X-Server-Id
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    ServerId:
      in: query
      name: serverId
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    Cursor:
      in: query
      name: cursor
      required: true
      description: Empty only before the first committed response; opaque, URL-encoded thereafter
      schema: { type: string, maxLength: 512 }
    Limit:
      in: query
      name: limit
      required: true
      schema: { type: integer, minimum: 1, maximum: 1000 }
  responses:
    Unauthorized:
      description: Missing or invalid credential; no command or event side effects
    Forbidden:
      description: Credential does not authorize the requested server
    ReconciliationRequired:
      description: Unknown cursor, identity conflict, or missing punishment context. Require explicit investigation; do not reset state.
    Retry:
      description: Transient failure; client retains durable work and retries with bounded exponential backoff
      headers:
        Retry-After:
          description: Minimum retry delay in seconds or an HTTP-date; also applies to other moderation requests
          schema: { type: string }
  schemas:
    PlayerUuid:
      type: string
      format: uuid
      not: { const: '00000000-0000-0000-0000-000000000000' }
    PlayerUtcTime:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
      description: UTC at or after Unix epoch; observations no more than five minutes ahead of website time
    PlayerTelemetry:
      type: object
      additionalProperties: false
      required: [playerUuid, playerName, revision, observedAt, firstJoinedAt, lastJoinedAt, online, economy, sessions, recentAddresses]
      properties:
        playerUuid: { $ref: '#/components/schemas/PlayerUuid' }
        playerName:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'
        revision: { type: integer, minimum: 1, maximum: 9223372036854775806 }
        observedAt: { $ref: '#/components/schemas/PlayerUtcTime' }
        firstJoinedAt: { $ref: '#/components/schemas/PlayerUtcTime' }
        lastJoinedAt: { $ref: '#/components/schemas/PlayerUtcTime' }
        lastLeftAt:
          anyOf:
            - $ref: '#/components/schemas/PlayerUtcTime'
            - { type: 'null' }
        online: { type: boolean }
        totalPlaySeconds: { type: [integer, 'null'], minimum: 0, maximum: 9223372036854775806 }
        loginCount: { type: [integer, 'null'], minimum: 0, maximum: 9223372036854775806 }
        economy: { $ref: '#/components/schemas/PlayerEconomy' }
        sessions:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/PlayerSession' }
        recentAddresses:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/PlayerAddress' }
      description: |
        firstJoinedAt <= lastJoinedAt <= observedAt, all history <= observedAt.
        If online, lastLeftAt <= lastJoinedAt; if offline, lastLeftAt >= lastJoinedAt
        when known. Null counters mean unknown. Never derive join times from names,
        punishments, directory reads or file modification dates.
    PlayerEconomy:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [AVAILABLE, UNAVAILABLE, NOT_INSTALLED, NO_ACCOUNT] }
        balance:
          type: [string, 'null']
          pattern: '^-?(0|[1-9][0-9]{0,17})(\.[0-9]{1,6})?$'
        provider: { type: [string, 'null'], minLength: 1, maxLength: 128, pattern: '^(?!\s*$)[^\u0000-\u001F\u007F-\u009F]+$' }
        currency: { type: [string, 'null'], minLength: 1, maxLength: 32, pattern: '^(?!\s*$)[^\u0000-\u001F\u007F-\u009F]+$' }
      allOf:
        - if:
            properties: { status: { const: AVAILABLE } }
          then:
            required: [balance, provider, currency]
            properties:
              balance: { type: string }
              provider: { type: string }
              currency: { type: string }
          else:
            properties: { balance: { type: 'null' } }
    PlayerSession:
      type: object
      additionalProperties: false
      required: [sessionId, joinedAt]
      properties:
        sessionId: { $ref: '#/components/schemas/PlayerUuid' }
        joinedAt: { $ref: '#/components/schemas/PlayerUtcTime' }
        leftAt:
          anyOf:
            - $ref: '#/components/schemas/PlayerUtcTime'
            - { type: 'null' }
      description: Distinct stable IDs; first join <= joinedAt <= latest join; joinedAt <= leftAt <= observedAt
    PlayerAddress:
      type: object
      additionalProperties: false
      required: [address, lastSeenAt]
      properties:
        address: { type: string, minLength: 2, maxLength: 45 }
        lastSeenAt: { $ref: '#/components/schemas/PlayerUtcTime' }
      description: |
        Literal IPv4/IPv6 only, no DNS, port, brackets, scope, whitespace or abbreviated IPv4.
        Normalize mapped IPv6 to IPv4 and deduplicate normalized addresses.
        firstJoinedAt <= lastSeenAt <= observedAt. Retain five distinct recent addresses.
    Envelope:
      type: object
      required: [schemaVersion, requestId, serverId]
      properties:
        schemaVersion: { type: integer, const: 1 }
        requestId: { type: string, format: uuid }
        serverId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    ActionPage:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [actions, cursor, hasMore]
          properties:
            actions:
              type: array
              maxItems: 1000
              items: { $ref: '#/components/schemas/Action' }
            cursor: { type: string, minLength: 1, maxLength: 512 }
            hasMore: { type: boolean }
    Action:
      type: object
      additionalProperties: false
      required: [actionId, type, target, punishmentId, staffId, issuedAt, validUntil, payload]
      properties:
        actionId: { type: string, format: uuid }
        type:
          type: string
          enum: [CREATE_BAN, CREATE_MUTE, CREATE_WARNING, CREATE_KICK, CREATE_COMMUNITY_SERVICE, REVOKE_PUNISHMENT, MODIFY_EXPIRATION, ADD_SERVICE_BLOCKS, SET_SERVICE_BLOCKS, RELEASE_SERVICE, ROTATE_APPEAL_TOKEN]
        target:
          type: object
          additionalProperties: false
          required: [uuid]
          properties:
            uuid: { type: string, format: uuid }
            lastKnownName:
              type: [string, 'null']
              pattern: '^[A-Za-z0-9_]{1,16}$'
        punishmentId: { type: string, format: uuid }
        expectedRevision:
          type: [integer, 'null']
          minimum: 0
          description: Omit, null or zero for creation. Required current revision for every mutation.
        staffId: { type: string, minLength: 1, maxLength: 128 }
        issuedAt: { type: string, format: date-time, pattern: 'Z$' }
        validUntil:
          type: string
          format: date-time
          pattern: 'Z$'
          description: Required command expiry. Kicks are additionally clamped to issuedAt plus configured 30 seconds.
        payload:
          type: object
          additionalProperties: false
          properties:
            reason: { type: string, minLength: 1, maxLength: 1000 }
            expiresAt: { type: [string, 'null'], format: date-time, pattern: 'Z$' }
            blocks: { type: integer, minimum: 1, maximum: 1000000 }
            tool: { type: string, enum: [WOODEN_PICKAXE, STONE_PICKAXE] }
            appealUrl: { $ref: '#/components/schemas/AppealUrl' }
      description: |
        Payloads are strictly allowlisted per action; see website-integration.md. reason is
        required for creation. expiresAt is required for MODIFY_EXPIRATION (null=permanent).
        blocks is required for CREATE_COMMUNITY_SERVICE, ADD_SERVICE_BLOCKS and SET_SERVICE_BLOCKS.
        appealUrl is required for remote ROTATE_APPEAL_TOKEN. Unknown fields/actions reject.
        Plugin configured block limits also apply. SET_SERVICE_BLOCKS supports appeal reduction;
        reducing to completed progress requests safe restoration, not snapshot deletion.
    ActionOutcome:
      type: object
      additionalProperties: false
      required: [actionId, applied, code]
      properties:
        actionId: { type: string, format: uuid }
        applied: { type: boolean }
        code:
          type: string
          description: Stable result code, e.g. APPLIED, REVISION_CONFLICT, INVALID_ACTION, EXPIRED, QUARRY_UNAVAILABLE
        punishmentId: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
    Event:
      type: object
      additionalProperties: false
      required: [schemaVersion, eventId, serverId, eventType, timestamp, targetPlayerUuid, punishmentId, revision, payload]
      properties:
        schemaVersion: { type: integer, const: 1 }
        eventId: { type: string, format: uuid }
        serverId: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        eventType:
          type: string
          description: Versioned domain event; includes punishment.*, warning.*, kick.*, community_service.*
        timestamp: { type: string, format: date-time, pattern: 'Z$' }
        targetPlayerUuid: { type: string, format: uuid }
        punishmentId: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        payload:
          type: object
          description: Event-specific public data and actor; never an inventory snapshot or appeal credential
          additionalProperties: true
    AppealUrl:
      type: string
      format: uri
      pattern: '^https://www\.mineplay\.co\.uk/appeal/[A-Za-z0-9_-]{43,128}$'
      description: Backend-registered 256-bit-minimum base64url secret; never publish in event or public history payloads
