# MiniMessage templates. All supplied placeholders are escaped text/components,
# never parsed as markup. Do not put credentials or tokens in public messages.
prefix: '<gold>Mineplay</gold> <dark_gray>»</dark_gray> '
ban: '<red><bold>You are banned from Mineplay.</bold></red><newline><gray>Reason: <white><reason></white><newline>Expires: <white><expires></white><newline>Reference: <white><reference></white><newline><appeal>'
mute: '<red>You are muted.</red> <gray>Remaining: <white><remaining></white>. Reason: <white><reason></white>. Reference: <reference><newline><appeal>'
warning: '<yellow><bold>STAFF WARNING</bold></yellow><newline><white><reason></white><newline><gray>Reference: <reference>. Acknowledge using /mp acknowledge <id><newline><appeal>'
kick: '<red>You were kicked from Mineplay.</red><newline><white><reason></white><newline><gray>Reference: <reference>'
appeal-link: '<yellow>Appeal: <url></yellow>'
appeal-pending: '<yellow>Your appeal link is awaiting provisioning. Contact Mineplay staff and quote <reference>. Your punishment remains in force.</yellow>'
storage-unavailable: '<red>Moderation records are temporarily unavailable. Please retry shortly or contact staff.</red>'
chat-filter-blocked: '<red>Your message was blocked by the chat filter. Please rephrase it.</red>'
anti-afk-warning: '<yellow>You will be disconnected for inactivity in <seconds> seconds.</yellow><newline><white>Click this message or type /mpactive <code> to confirm you are here.</white>'
anti-afk-confirmed: '<green>Presence confirmed. Your idle timer has been reset.</green>'
anti-afk-invalid: '<yellow>No matching active idle check. Use the code from your latest warning.</yellow>'
anti-afk-kick: '<yellow>Disconnected for inactivity.</yellow><newline><gray>You can reconnect when you are ready to play.</gray>'
error: '<red><message></red>'
success: '<green><message></green>'
history-entry: '<gray><reference> | <type> | <status> | <issued> | <reason></gray>'
punishment-announcement: '<gold>Mineplay</gold> <dark_gray>»</dark_gray> <yellow><actor> <action> <target>.</yellow> <gray>Reason: <white><reason></white> [<reference>]</gray>'
service-progress: '<gold>COMMUNITY SERVICE — <completed> / <required> BLOCKS — <percent>% (<state>)</gold>'
service-milestone: '<yellow><remaining> blocks remaining. Keep going!</yellow>'
service-released: '<green>Community Service complete. Your saved state has been restored.</green>'
service-recovery: '<red>Inventory recovery required. Contact staff; your saved inventory is retained.</red>'
service-awaiting-quarry: '<yellow>Community Service is awaiting a safe quarry. Contact staff.</yellow>'
service-inventory-wait: '<yellow>Admission is waiting for an empty cursor and crafting grid, and a closed inventory. Contact staff.</yellow>'
service-command-blocked: '<red>That command is unavailable during Community Service.</red>'
